[workspace]
name = "Fused Drug Embedding Pipeline"
authors = [
    "James Bannon <bhklab.jamesbannon@gmail.com>"
]
description = "DNFv2 is the sequel to DNF using the tools from InteGrAO"
license = "MIT"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[environments]
quality = { features = ["quality"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[activation]
# convenient variables which can be used in scripts
env.CONFIG = "${PIXI_PROJECT_ROOT}/config"
env.METADATA = "${PIXI_PROJECT_ROOT}/metadata"
env.LOGS = "${PIXI_PROJECT_ROOT}/logs"
env.RAWDATA = "${PIXI_PROJECT_ROOT}/data/rawdata"
env.PROCDATA = "${PIXI_PROJECT_ROOT}/data/procdata"
env.RESULTS = "${PIXI_PROJECT_ROOT}/data/results"
env.SCRIPTS = "${PIXI_PROJECT_ROOT}/workflow/scripts"
env.R_LIBS_USER = "${PIXI_PROJECT_ROOT}/.pixi/r-library"
env.PYTHONUNBUFFERED = "1"

[dependencies]
python = ">=3.13,<3.14"
numpy = ">=2,<3"
pandas = ">=2.2,<3"
scipy = ">=1.14,<2"
networkx = ">=3,<4"
requests = ">=2,<3"
r-base = ">=4.5,<4.6"
r-remotes = ">=2.5,<3"
r-biocmanager = ">=1.30,<2"
r-tidyr = ">=1.3,<2"
r-dplyr = ">=1.1,<2"
r-tibble = ">=3,<4"
r-yaml = ">=2.3,<3"
ipython = "*"
ipykernel = "*"
jupyterlab = "*"
pip = "*"
rdkit = ">=2026.3.3,<2027"
tqdm = ">=4.70.1,<5"
transformers = ">=5.10.2,<6"
pytorch = ">=2.13.0,<3"
torch-geometric = ">=2.6.1,<3"
pyarrow = ">=24.0.0,<25"
scikit-learn = ">=1.5.0, <1.6"
pyyaml = ">=6.0.3,<7"
xgboost = ">=3.4.1,<4"
bioconductor-biobase = ">=2.70.0,<3"
bioconductor-biocgenerics = ">=0.56.0,<0.57"
bioconductor-s4vectors = ">=0.48.1,<0.49"
bioconductor-summarizedexperiment = ">=1.40.0,<2"
bioconductor-multiassayexperiment = ">=1.36.2,<2"
bioconductor-biocparallel = ">=1.44.0,<2"
bioconductor-matrixgenerics = ">=1.22.0,<2"
bioconductor-bumpymatrix = ">=1.18.0,<2"
r-ggplot2 = ">=4.0.3,<5"
r-rcolorbrewer = ">=1.1_3,<2"
r-catools = ">=1.18.3,<2"
r-downloader = ">=0.4.1,<0.5"
r-reshape2 = ">=1.4.5,<2"
r-jsonlite = ">=2.0.0,<3"
"r-data.table" = ">=1.18.6.1,<2"
r-checkmate = ">=2.3.3,<3"
r-boot = ">=1.3_32,<2"
r-rcpp = ">=1.1.2,<2"
r-lsa = ">=0.73.4,<0.74"
r-crayon = ">=1.5.3,<2"
r-glue = ">=1.8.1,<2"
r-rlang = ">=1.3.0,<2"
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
fortran-compiler = ">=2.0.0,<3"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
r-maps = ">=3.4.3,<4"
r-httpuv = ">=1.6.16,<2"

[pypi-dependencies]
damply = ">=0.10.0, <0.11"
pot = ">=0.9.6.post1, <0.10"
snfpy = ">=0.2.2, <0.3"
seaborn = ">=0.13.2, <0.14"
umap-learn = ">=0.5.7, <0.6"


[tasks]
setup = { cmd = "Rscript workflow/scripts/setup.R", description = "Install PharmacoGx devel from GitHub" }
download = { cmd = "python workflow/scripts/download.py && Rscript workflow/scripts/fetch_viability.R", description = "Download inputs and prepare NCI60 responses" }
generate-embeddings = { cmd = "mkdir -p data/results && python workflow/scripts/generate_embeddings.py", description = "Generate embeddings from prepared input files" }

############################################## QUALITY ###############################################
# Quality includes linting, type checking, and formatting
[feature.quality.dependencies]
ruff = "*"

[feature.quality.tasks]
ruff-check.cmd = ["ruff", "check"]
ruff-check.inputs = ["ruff.toml", "workflow"]
ruff-check.description = "Run ruff check"

ruff-format.cmd = ["ruff", "format"]
ruff-format.inputs = ["ruff.toml", "workflow"]
ruff-format.depends-on = ["ruff-check"]
ruff-format.description = "Run ruff format, run check first"

qc.depends-on = ["ruff-format", "ruff-check"]
qc.description = "Quality check: ruff check and format"

############################################## DOCS ################################################

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-include-markdown-plugin = ">=7.0.0,<8"

[feature.docs.tasks.doc-build]
cmd = "mkdocs build -f mkdocs.yaml"
description = "Build documentation with mkdocs"

[feature.docs.tasks.doc-serve]
cmd = "mkdocs serve -f mkdocs.yaml"
depends-on = ["doc-build"]
description = "Serve documentation with mkdocs, runs doc-build first"
